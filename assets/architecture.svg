<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 310" width="1100" height="310" role="img" aria-label="A convolutional extractor is trained once and frozen, producing a six-dimensional embedding shared by a classical MLP, a linear layer and a variational quantum circuit. Only the head varies.">
<style>
  .bx { font: 600 15px ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; text-anchor: middle; }
  .bs { font: 400 11.5px ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; fill: #64748B; text-anchor: middle; }
  .ax { font: 400 12.5px ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; fill: #64748B; }
  .em { font: 600 12.5px ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; fill: #F2A03D; }
  .wire { fill: none; stroke: #64748B; stroke-opacity: .5; stroke-width: 1.6; }
</style>

<rect x="48" y="118" width="176" height="76" rx="7" fill="#64748B" fill-opacity=".10" stroke="#64748B" stroke-width="1.6"/><text class="bx" x="136.0" y="155.0" fill="#64748B">I/Q input</text><text class="bs" x="136.0" y="173.0">2 x 128 samples</text>
<line class="wire" x1="224" y1="156" x2="322" y2="156"/>
<rect x="322" y="118" width="176" height="76" rx="7" fill="#00C2A8" fill-opacity=".10" stroke="#00C2A8" stroke-width="1.6"/><text class="bx" x="410.0" y="155.0" fill="#00C2A8">CNN extractor</text><text class="bs" x="410.0" y="173.0">trained once, frozen</text>
<line class="wire" x1="498" y1="156" x2="562" y2="156"/>
<circle r="4.5" fill="#F2A03D" opacity="0"><animateMotion dur="2.8s" begin="0s" repeatCount="indefinite" path="M 224 156 L 322 156"/><animate attributeName="opacity" dur="2.8s" begin="0s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.15;0.85;1"/></circle>
<circle r="4.5" fill="#F2A03D" opacity="0"><animateMotion dur="2.8s" begin="0.5s" repeatCount="indefinite" path="M 498 156 L 562 156"/><animate attributeName="opacity" dur="2.8s" begin="0.5s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.15;0.85;1"/></circle>

<rect x="562" y="102" width="46" height="108" rx="6" fill="#F2A03D" fill-opacity=".12" stroke="#F2A03D" stroke-width="1.6"/>
<circle cx="585" cy="118" r="3.6" fill="#F2A03D"/><circle cx="585" cy="134" r="3.6" fill="#F2A03D"/><circle cx="585" cy="150" r="3.6" fill="#F2A03D"/><circle cx="585" cy="166" r="3.6" fill="#F2A03D"/><circle cx="585" cy="182" r="3.6" fill="#F2A03D"/><circle cx="585" cy="198" r="3.6" fill="#F2A03D"/>
<text class="em" x="612" y="238" text-anchor="end">shared aperture, d = n = 6</text>

<path class="wire" d="M 608 156 C 654 156 654 62 704 62"/>
<path class="wire" d="M 608 156 L 704 156"/>
<path class="wire" d="M 608 156 C 654 156 654 250 704 250"/>

<rect x="704" y="34" width="202" height="56" rx="7" fill="#00C2A8" fill-opacity=".10" stroke="#00C2A8" stroke-width="1.6"/><text class="bx" x="805.0" y="61.0" fill="#00C2A8">classical MLP</text><text class="bs" x="805.0" y="79.0">6 - 64 - 64 - C</text>
<rect x="704" y="128" width="202" height="56" rx="7" fill="#00C2A8" fill-opacity=".10" stroke="#00C2A8" stroke-width="1.6"/><text class="bx" x="805.0" y="155.0" fill="#00C2A8">linear</text><text class="bs" x="805.0" y="173.0">single affine map</text>
<rect x="704" y="222" width="202" height="56" rx="7" fill="#7C6BF5" fill-opacity=".10" stroke="#7C6BF5" stroke-width="1.6"/><text class="bx" x="805.0" y="249.0" fill="#7C6BF5">quantum VQC</text><text class="bs" x="805.0" y="267.0">6 qubits, 4 layers</text>

<line x1="924" y1="34" x2="924" y2="278" stroke="#F2A03D" stroke-width="2" stroke-opacity=".6"/>
<text class="em" x="936" y="160">only this varies</text>
<text class="ax" x="48" y="292">The embedding is common to every arm, so the head is the only difference left to measure.</text>
</svg>